<!-- Mobile shell — centered on desktop, full-screen on mobile -->
<div class="min-h-screen bg-shell flex justify-center items-start">
  <div class="relative w-full max-w-[430px] min-h-screen bg-canvas flex flex-col shadow-2xl">

    <!-- Page content -->
    <main class="flex-1" [class.pb-20]="showNav()">
      <router-outlet />
    </main>

    <!-- Bottom navigation -->
    @if (showNav()) {
      <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-surface border-t border-edge flex z-50">
        <a routerLink="/routines" routerLinkActive="nav-active"
           class="nav-item flex-1 flex flex-col items-center justify-center py-3 gap-0.5 text-ink-muted transition-colors">
          <svg lucideHome [size]="22" [strokeWidth]="1.8"></svg>
          <span class="text-[10px] font-medium">{{ 'nav.home' | t }}</span>
        </a>
        <a routerLink="/explore" routerLinkActive="nav-active"
           class="nav-item flex-1 flex flex-col items-center justify-center py-3 gap-0.5 text-ink-muted transition-colors">
          <svg lucideCompass [size]="22" [strokeWidth]="1.8"></svg>
          <span class="text-[10px] font-medium">{{ 'nav.explore' | t }}</span>
        </a>
        <a routerLink="/saved" routerLinkActive="nav-active"
           class="nav-item flex-1 flex flex-col items-center justify-center py-3 gap-0.5 text-ink-muted transition-colors">
          <svg lucideBookmark [size]="22" [strokeWidth]="1.8"></svg>
          <span class="text-[10px] font-medium">{{ 'nav.saved' | t }}</span>
        </a>
        <a routerLink="/profile" routerLinkActive="nav-active"
           class="nav-item flex-1 flex flex-col items-center justify-center py-3 gap-0.5 text-ink-muted transition-colors">
          <svg lucideUser [size]="22" [strokeWidth]="1.8"></svg>
          <span class="text-[10px] font-medium">{{ 'nav.profile' | t }}</span>
        </a>
      </nav>
    }

  </div>
</div>
